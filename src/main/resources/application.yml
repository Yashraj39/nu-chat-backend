spring:
  application:
    name: pulsechat-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:pulsechat}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_BYTES:524288000}
      max-request-size: ${MAX_FILE_SIZE_BYTES:524288000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
app:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  max-file-size: ${MAX_FILE_SIZE_BYTES:524288000}
  chat-rate-limit: ${CHAT_RATE_LIMIT_PER_MINUTE:30}
  upload-rate-limit: ${UPLOAD_RATE_LIMIT_PER_MINUTE:10}
  admin-invite-code: ${ADMIN_INVITE_CODE:}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
